version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Redis High-Performance Cache Service
  # -------------------------------------------------------------
  redis-cache:
    image: redis:alpine
    container_name: socialpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - socialpilot-network

  # -------------------------------------------------------------
  # 2. FastAPI Backend API & Scheduler Service
  # -------------------------------------------------------------
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialpilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - redis-cache
    networks:
      - socialpilot-network

  # -------------------------------------------------------------
  # 3. Next.js Frontend Production Application
  # -------------------------------------------------------------
  nextjs-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - fastapi-backend
    networks:
      - socialpilot-network

# ---------------------------------------------------------------
# Custom Internal Bridge Network
# ---------------------------------------------------------------
networks:
  socialpilot-network:
    driver: bridge
